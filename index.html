<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillMatch - Encontre sua vaga</title>

    <meta
        name="description"
        content="Compare suas habilidades com vagas de Front-end e descubra quais oportunidades combinam com você."
    >

    <link rel="stylesheet" href="./assets/styles/index.style.css">
</head>

<body>

    <header>
        <h1>SkillMatch</h1>

        <p>
            Descubra quais vagas combinam com suas habilidades.
        </p>
    </header>

    <main>

        <section>
    <h2>Seu perfil</h2>

    <form id="formulario-perfil">

        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div>
            <label for="area">Área de interesse:</label>
            <input type="text" id="area" name="area" required>
        </div>

        <div>
            <label for="experiencia">Tempo de experiência:</label>
            <input
                type="number"
                id="experiencia"
                name="experiencia"
                min="0"
                required
            >
        </div>

        <fieldset>
            <legend>Habilidades</legend>

            <label>
                <input type="checkbox" name="habilidades" value="HTML">
                HTML
            </label>

            <label>
                <input type="checkbox" name="habilidades" value="CSS">
                CSS
            </label>

            <label>
                <input type="checkbox" name="habilidades" value="JavaScript">
                JavaScript
            </label>

            <label>
                <input type="checkbox" name="habilidades" value="Git">
                Git
            </label>

            <label>
                <input type="checkbox" name="habilidades" value="React">
                React
            </label>
        </fieldset>

        <button type="submit">Analisar vagas</button>

        <p id="mensagem-erro"></p>

    </form>
</section>

        <section>
            <h2>Vagas disponíveis</h2>

            <div id="resultados"></div>
        </section>

    </main>

    <footer>
        <p>SkillMatch - Projeto acadêmico</p>
    </footer>

    <script type="module" src="./assets/scripts/main.js"></script>

</body>
</html>
